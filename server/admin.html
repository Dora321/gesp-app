<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课堂 AI · 教师设置</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#292824;background:#f5f3ed}*{box-sizing:border-box}body{margin:0;padding:48px 20px}main{max-width:600px;margin:auto}small{letter-spacing:2px;color:#77756d}h1{font-family:serif;font-size:34px;font-weight:500;margin:12px 0}p{color:#737168;line-height:1.7}.card{padding:28px;background:#fffef9;border:1px solid #dedbd2;border-radius:12px;margin-top:28px}label{display:block;font-size:14px;margin:18px 0 8px}input,button{font:inherit;min-height:44px;border-radius:6px}input{width:100%;padding:10px;border:1px solid #c9c5ba;background:#fff}button{padding:10px 18px;background:#526653;color:white;border:0;cursor:pointer}button.secondary{background:#eae7de;color:#35372e}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}.row>*{flex:1}.code{font-size:52px;letter-spacing:10px;margin:20px 0;color:#3e5240;font-variant-numeric:tabular-nums}#notice{min-height:28px;color:#765b35}#status{padding:12px 0;border-top:1px solid #e5e1d8}a{color:#526653}[hidden]{display:none!important}
</style></head><body><main><small>CLASSROOM / AI</small><h1>让问题，留在课堂里。</h1><p>填一次密钥。上课时开启，把口令告诉学生即可。</p>
<section class="card" id="login"><h2>教师登录</h2><form id="login-form"><label for="password">教师密码</label><input id="password" type="password" autocomplete="current-password" required><div class="row"><button>进入设置</button></div></form></section>
<section class="card" id="settings" hidden>
<form id="key-form"><label for="key" id="key-label">AI 密钥 · 尚未配置</label><input id="key" type="password" autocomplete="off" placeholder="粘贴 API key，保存后不再显示" required><div class="row"><button class="secondary">保存密钥</button></div></form>
<div id="live" hidden><p>本堂课口令</p><div id="code" class="code"></div><div class="row"><button id="copy" class="secondary">复制口令</button><button id="rotate" class="secondary">换一个</button></div></div>
<form id="start-form"><div class="row"><div><label for="minutes">有效时间（分钟）</label><input id="minutes" type="number" min="5" max="480" value="120" required></div><div><label for="max">全班提问上限（次）</label><input id="max" type="number" min="1" max="5000" value="500" required></div></div><div class="row"><button id="start">开启课堂</button></div></form>
<p id="status" aria-live="polite"></p><div class="row"><button id="stop" hidden>结束课堂</button><button id="logout" class="secondary">退出后台</button></div>
<p>换口令会让所有学生重新激活，剩余次数不变。提问受理即计次，生成中断或上游失败也计入，以避免反复重试超额。</p>
</section><p id="notice" role="status"></p><p><a href="https://dora321.github.io/gesp-app/">返回学生课堂 →</a></p></main><script src="/classroom-admin.js" defer></script></body></html>
