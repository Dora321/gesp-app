name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Lint
        run: npm run lint

      - name: Validate question bank
        run: npm run validate:bank

      - name: Validate programming questions (compile + run samples)
        run: npm run validate:programming:run

      - name: Check paper source registry
        run: npm run check:sources

      - name: Verify sitemap is current
        run: |
          npm run generate:sitemap
          git diff --exit-code -- public/sitemap.xml

      - name: Run course and route checks
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Verify static route metadata and PWA assets
        run: npm run check:prerender

      - name: Enforce bundle budgets
        run: npm run check:bundle

      - name: Upload build for browser checks
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 1

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  browser-checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    strategy:
      matrix:
        include:
          - name: Cross-course mastery UI checks
            command: npm run check:course-mastery-ui
          - name: Smoke test desktop and mobile routes
            command: npm run smoke
          - name: Accessibility checks
            command: npm run check:a11y
          - name: Visual and layout regression
            command: npm run visual

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run check
        run: ${{ matrix.command }}
        env:
          COURSE_MASTERY_SERVER: preview

  deploy:
    runs-on: ubuntu-latest
    needs: [build, browser-checks]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
