name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Install browser for course UI checks
        run: npx playwright install --with-deps chromium

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Lint
        run: npm run lint

      - name: Validate question bank
        run: npm run validate:bank

      - name: Verify sitemap is current
        run: |
          npm run generate:sitemap
          git diff --exit-code -- public/sitemap.xml

      - name: Run course and route checks
        run: npm run check

      - name: Run cross-course mastery UI checks
        run: npm run check:course-mastery-ui
        timeout-minutes: 5

      - name: Run unit tests
        run: npm test

      - name: Build
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Verify static route metadata and PWA assets
        run: npm run check:prerender

      - name: Smoke test desktop and mobile routes
        run: npm run smoke

      - name: Visual and layout regression
        run: npm run visual
        timeout-minutes: 5
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
