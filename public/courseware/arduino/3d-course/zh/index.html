          <div class="noscript">
            <p>在浏览器中学习的交互式 3D 课程。请开启 JavaScript 后开始。</p>
            <ol class="noscript-lessons"><li><b>1. 认识开发板</b> — Arduino Uno 是一款很受欢迎的微控制器开发板，基于 ATmega328P。</li><li><b>2. 让 LED 闪烁</b> — 你的第一个电路：面包板上的一个 LED 和一个电阻，由引脚 13 驱动。</li><li><b>3. 按下按钮</b> — 输入让开发板能感知外界。</li><li><b>4. 转动旋钮</b> — 电位器是带滑片的电阻。</li><li><b>5. 混合颜色</b> — RGB LED 是装在同一个乳白色灯罩里的三个 LED：红、绿、蓝。</li><li><b>6. 感知光线</b> — 光敏电阻（LDR）受到的光越多，导电越好。</li><li><b>7. 读取传感器</b> — HC-SR04 发出一串超声波，然后听回声。</li><li><b>8. 发出声音</b> — 压电蜂鸣器在引脚每切换一次时就“咔”一声。</li><li><b>9. 迷你钢琴</b> — 八个按键加一个蜂鸣器，就是一架能弹的钢琴。</li><li><b>10. 控制电机</b> — 引脚本身带不动电机，所以由晶体管来干重活。</li><li><b>11. 感知温度</b> — TMP36 把温度变成电压：0 °C 时 0.5 V，每升高一度多 10 mV。</li><li><b>12. 让舵机摆动</b> — 舵机是知道自己位置的电机。</li><li><b>13. 转动转盘</b> — 步进电机按精确的步数转动，这一款转一整圈是 2048 步。</li><li><b>14. 智能植物</b> — 插在土里的电容式传感器告诉你土壤有多湿，一块小小的 OLED 屏幕把它变成百分比和表情。</li><li><b>15. 感受压力</b> — 压力传感器（FSR）是一片薄薄的垫子，按下去时它的电阻会从几百万欧姆降到几百欧姆。</li><li><b>16. 动手做项目</b> — 把学过的都用上：距离传感器盯着障碍物，红绿灯告诉司机什么时候该停。</li></ol>
          </div>
