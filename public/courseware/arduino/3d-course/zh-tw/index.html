          <div class="noscript">
            <p>在瀏覽器中學習的互動式 3D 課程。請開啟 JavaScript 後開始。</p>
            <ol class="noscript-lessons"><li><b>1. 認識開發板</b> — Arduino Uno 是一款很受歡迎的微控制器開發板，基於 ATmega328P。</li><li><b>2. 讓 LED 閃爍</b> — 你的第一個電路：麵包板上的一個 LED 和一個電阻，由腳位 13 驅動。</li><li><b>3. 按下按鈕</b> — 輸入讓開發板能感知外界。</li><li><b>4. 轉動旋鈕</b> — 可變電阻是帶滑動端的電阻。</li><li><b>5. 混合顏色</b> — RGB LED 是裝在同一個乳白色燈罩裡的三個 LED：紅、綠、藍。</li><li><b>6. 感知光線</b> — 光敏電阻（LDR）受到的光越多，導電越好。</li><li><b>7. 讀取感測器</b> — HC-SR04 發出一串超音波，然後聽回聲。</li><li><b>8. 發出聲音</b> — 壓電蜂鳴器在腳位每切換一次時就「咔」一聲。</li><li><b>9. 迷你鋼琴</b> — 八個按鍵加一個蜂鳴器，就是一架能彈的鋼琴。</li><li><b>10. 控制馬達</b> — 腳位本身推不動馬達，所以由電晶體來扛重活。</li><li><b>11. 感知溫度</b> — TMP36 把溫度變成電壓：0 °C 時 0.5 V，每升高一度多 10 mV。</li><li><b>12. 讓伺服馬達擺動</b> — 伺服馬達是知道自己位置的馬達。</li><li><b>13. 轉動轉盤</b> — 步進馬達按精確的步數轉動，這一款轉一整圈是 2048 步。</li><li><b>14. 智慧植物</b> — 插在土裡的電容式感測器告訴你土壤有多濕，一塊小小的 OLED 螢幕把它變成百分比和表情。</li><li><b>15. 感受壓力</b> — 壓力感測器（FSR）是一片薄薄的墊子，按下去時它的電阻會從幾百萬歐姆降到幾百歐姆。</li><li><b>16. 動手做專案</b> — 把學過的都用上：距離感測器盯著障礙物，紅綠燈告訴司機什麼時候該停。</li></ol>
