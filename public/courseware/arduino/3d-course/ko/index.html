          <div class="noscript">
            <p>브라우저에서 바로 배우는 인터랙티브 3D 강좌예요. 시작하려면 JavaScript를 켜 주세요.</p>
            <ol class="noscript-lessons"><li><b>1. 보드 알아보기</b> — Arduino Uno는 ATmega328P를 탑재한 인기 있는 마이크로컨트롤러 보드예요.</li><li><b>2. LED 깜빡이기</b> — 첫 번째 회로예요.</li><li><b>3. 버튼 누르기</b> — 입력이 있으면 보드가 바깥 세상을 느낄 수 있어요.</li><li><b>4. 노브 돌리기</b> — 가변저항(포텐셔미터)은 슬라이더가 달린 저항이에요.</li><li><b>5. 색 섞기</b> — RGB LED는 우윳빛 렌즈 하나에 빨강, 초록, 파랑 LED 세 개가 들어 있어요.</li><li><b>6. 빛 감지하기</b> — 조도 센서(LDR)는 빛을 많이 받을수록 전기가 잘 통해요.</li><li><b>7. 센서 읽기</b> — HC-SR04는 초음파를 짧게 쏘고 메아리를 들어요.</li><li><b>8. 소리 내기</b> — 피에조 부저는 핀이 바뀔 때마다 딸깍 소리를 내요.</li><li><b>9. 미니 피아노</b> — 건반 여덟 개와 부저 하나면 연주할 수 있는 피아노가 돼요.</li><li><b>10. 모터 제어하기</b> — 핀 혼자서는 모터를 돌릴 수 없어서 트랜지스터가 힘든 일을 맡아요.</li><li><b>11. 열 감지하기</b> — TMP36은 온도를 전압으로 바꿔요.</li><li><b>12. 서보 움직이기</b> — 서보는 자기 위치를 아는 모터예요.</li><li><b>13. 룰렛 돌리기</b> — 스테퍼 모터는 정확한 스텝 단위로 돌아요.</li><li><b>14. 스마트 화분</b> — 흙에 꽂은 정전용량 센서가 흙이 얼마나 젖었는지 알려 주고, 작은 OLED 화면이 그것을 퍼센트와 표정으로 바꿔요.</li><li><b>15. 힘 느끼기</b> — 압력 센서(FSR)는 누르면 저항이 수백만 옴에서 수백 옴까지 떨어지는 얇은 패드예요.</li><li><b>16. 프로젝트 만들기</b> — 배운 걸 모두 합쳐 봐요.</li></ol>
