        <noscript>
          <style>.loader{overflow:auto}.loader-track,.loader-step{display:none}</style>
          <div class="noscript">
            <p>आपके ब्राउज़र में एक इंटरैक्टिव 3D कोर्स। शुरू करने के लिए JavaScript चालू करें।</p>
            <ol class="noscript-lessons"><li><b>1. बोर्ड को जानें</b> — Arduino Uno एक लोकप्रिय माइक्रोकंट्रोलर बोर्ड है, जो ATmega328P पर आधारित है।</li><li><b>2. LED ब्लिंक करें</b> — आपका पहला सर्किट: ब्रेडबोर्ड पर एक LED और एक रेज़िस्टर, जिन्हें पिन 13 चलाता है।</li><li><b>3. बटन दबाएँ</b> — इनपुट से बोर्ड दुनिया को महसूस कर पाता है।</li><li><b>4. नॉब घुमाएँ</b> — पोटेंशियोमीटर एक स्लाइडर वाला रेज़िस्टर है।</li><li><b>5. रंग मिलाएँ</b> — RGB LED में एक दूधिया लेंस के नीचे तीन LED होती हैं — लाल, हरी और नीली।</li><li><b>6. रोशनी पहचानें</b> — लाइट-डिपेंडेंट रेज़िस्टर (LDR) पर जितनी ज़्यादा रोशनी पड़ती है, वह उतना बेहतर करंट चलाता है।</li><li><b>7. सेंसर पढ़ें</b> — HC-SR04 अल्ट्रासाउंड की एक लहर भेजता है और उसकी गूँज सुनता है।</li><li><b>8. आवाज़ निकालें</b> — पीज़ो बज़र हर बार पिन बदलने पर क्लिक की आवाज़ करता है।</li><li><b>9. मिनी पियानो</b> — आठ कुंजियाँ और एक बज़र मिलकर ऐसा पियानो बनाते हैं जिसे आप बजा सकते हैं।</li><li><b>10. मोटर चलाएँ</b> — अकेला पिन मोटर नहीं चला सकता, इसलिए भारी काम ट्रांज़िस्टर करता है।</li><li><b>11. गर्मी मापें</b> — TMP36 तापमान को वोल्टेज में बदलता है: 0 °C पर 0.5 V और हर डिग्री पर 10 mV ज़्यादा।</li><li><b>12. सर्वो घुमाएँ</b> — सर्वो एक ऐसी मोटर है जिसे पता होता है कि वह कहाँ है।</li><li><b>13. पहिया घुमाएँ</b> — स्टेपर मोटर बिल्कुल तय क़दमों में घूमती है — इसमें 2048 क़दम पर एक पूरा चक्कर होता है।</li><li><b>14. स्मार्ट पौधा</b> — मिट्टी में लगा कैपेसिटिव सेंसर बताता है कि मिट्टी कितनी गीली है, और एक छोटी OLED स्क्रीन उसे प्रतिशत और मूड में बदल देती है।</li><li><b>15. ताक़त महसूस करें</b> — फ़ोर्स सेंसर (FSR) एक पतला पैड है, जिसे दबाने पर उसका रेज़िस्टेंस लाखों ओम से घटकर कुछ सौ ओम रह जाता है।</li><li><b>16. प्रोजेक्ट बनाएँ</b> — सब कुछ एक साथ जोड़ें: दूरी सेंसर रुकावट पर नज़र रखता है और ट्रैफ़िक लाइट ड्राइवर को बताती है कि कब रुकना है।</li></ol>
