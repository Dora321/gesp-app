          <div class="noscript">
            <p>ブラウザで学べる3Dのインタラクティブ講座です。始めるにはJavaScriptをオンにしてください。</p>
            <ol class="noscript-lessons"><li><b>1. ボードを知ろう</b> — Arduino Unoは、ATmega328Pを搭載した人気のマイコンボードです。</li><li><b>2. LEDを点滅させよう</b> — 最初の回路です。</li><li><b>3. ボタンを押そう</b> — 入力を使うと、ボードは外の世界を感じ取れます。</li><li><b>4. ツマミを回そう</b> — 可変抵抗（ポテンショメーター）は、スライダーの付いた抵抗です。</li><li><b>5. 色を混ぜよう</b> — RGB LEDは、赤・緑・青の3つのLEDが乳白色のレンズの中に入ったものです。</li><li><b>6. 光を感じよう</b> — 光センサー（LDR、CdSセル）は、光が当たるほど電気を通しやすくなります。</li><li><b>7. センサーを読もう</b> — HC-SR04は超音波を出して、その反射（エコー）を聞きます。</li><li><b>8. 音を鳴らそう</b> — 圧電ブザーは、ピンが切り替わるたびにカチッと鳴ります。</li><li><b>9. ミニピアノ</b> — 鍵盤8つとブザー1つで、弾けるピアノになります。</li><li><b>10. モーターを動かそう</b> — ピンだけではモーターを回せないので、トランジスタに力仕事を任せます。</li><li><b>11. 熱を測ろう</b> — TMP36は温度を電圧に変えます。</li><li><b>12. サーボを動かそう</b> — サーボは自分の位置がわかるモーターです。</li><li><b>13. ルーレットを回そう</b> — ステッピングモーターは決まったステップずつ回ります。</li><li><b>14. スマート植木鉢</b> — 土に挿した静電容量式センサーが土の湿り具合を測り、小さなOLED画面がそれをパーセントと表情に変えます。</li><li><b>15. 力を測ろう</b> — 感圧センサー（FSR）は、押すと抵抗が数百万Ωから数百Ωまで下がる薄いパッドです。</li><li><b>16. 作品を作ろう</b> — これまでの総まとめです。</li></ol>
          </div>
